health:
  status: healthy

access:
  default_action: allow
  rules: []

pre:
  default_action: proceed
  rules:
    # HITL: Block sandbox creation until human approves
    - toolkit: "Daytona"
      tool: "CreateSandbox"
      action: block
      error_message: "HITL_CHECKPOINT: Sandbox creation requires human approval."

    # Block direct pushes to main/master
    - toolkit: "Daytona"
      tool: "GitPush"
      input_match: "branch contains main"
      action: block
      error_message: "Direct push to protected branch blocked. Use a feature branch."

    # Force every agent-opened PR into draft — a human must promote it.
    # (CreatePullRequest has no `labels` param; `draft` is a real field, so
    # this override is actually enforced by the gateway, not just requested.)
    - toolkit: "Github"
      tool: "CreatePullRequest"
      action: proceed
      override:
        inputs:
          draft: true

post:
  default_action: proceed
  rules: []
